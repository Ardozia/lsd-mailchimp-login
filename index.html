<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailchimp Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
  <div class="container-fluid d-flex flex-column justify-content-between vh-100  bg-light">
    <div class="d-flex flex-column gap-5">
      <div class="d-flex justify-content-between align-items-center">
        <div class="icon-size pt-2">
          <img src="images/mc-freddie-dark.svg" />
        </div>
        <div class="">
          <form class="d-flex align-items-center ">
            <i class="bi bi-globe"></i>
            <select class="form-select border-0 bg-light" aria-label="Default select example">
              <option selected>English</option>
              <option value="1">Espanol</option>
              <option value="2">Português</option>
              <option value="3">Italiano</option>
            </select>
          </form>
        </div>
      </div>
      <div class="mx-0 mx-md-auto border border-1 rounded-3 p-4 bg-white">
        <div class="d-flex w-100 flex-column justify-content-between">
          <div class="w-50 m-auto"><img class="img-fluid" src="images/mc-rewards-text-dark_resized_compressed.webp" /></div>
          <div class="my-3 mx-auto"><h5 class="">Log In to Mailchimp</h5></div>
          <div class="d-flex flex-column my-2">
            <p class="m-0 ">Need a Mailchimp account? <a class="link-offset-2 " href="#">Create an
                account</a></p>
          </div>
          <form class="d-flex flex-column mt-4">
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label fw-semibold">Username or Email</label>
              <input type="email" class="form-control form-control-lg" id="exampleInputEmail1"
                aria-describedby="emailHelp">
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary px-5 my-2">
                <span class="">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4M4.5 7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7zM8 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                  </svg>
                </span>
                Log In
              </button>
            </div>

            <div class="row text-center my-3">
              <div class="col"><a class="link-offset-2" href="#">Forgot username?</a></div>
              <div class="col"><a class="link-offset-2" href="#">Forgot password?</a></div>
            </div>
          </form>
          <hr />
          <div>
            <p class="m-0">Or, if you created your Mailchimp account with Google:</p>
            <div class="d-grid position-relative mt-3">
              <button class="btn btn-outline-primary px-5 py-3 fw-bold text-nowrap">
                <img class="position-absolute top-50 start-0 translate-middle-y ms-3"
                  src="https://digitalasset.intuit.com/render/content/dam/intuit/mc-fe/en_us/images/crm/appointments/appointments-google-logo.svg"
                  width="30px" alt="" height="30px">
                Continue
                with
                Google</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="ms-4 fs-custom text-secondary py-2">
        <label>©2026 Intuit Inc. All rights reserved. Mailchimp® is a registered trademark of The Rocket Science Group, Cookie Preferences, Privacy, and Terms</label>
      </div>
    </div>
  </div>
  <div class="d-sm-none position-absolute w-100 top-0 start-0 bh"></div>
  <div class="d-none d-sm-block position-absolute vh-100 top-0 start-0 bv"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
</body>
</body>

</html>
